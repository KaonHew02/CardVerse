<!doctype html>
<!-- CardVerse — logo contact sheet. Generated variants only; regenerate with
     `node tools/build-logo.mjs`, never hand-edit the SVGs. Open this to check
     the mark still reads at 16px before shipping a change to it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>CardVerse logo</title>
<style>
    body { margin: 0; padding: 28px; background: #0f1419; color: #e8edf2;
           font: 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em;
         color: #8a97a6; margin: 26px 0 10px; font-weight: 700; }
    .row { display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; }
    .cell { text-align: center; }
    .cell small { display: block; color: #8a97a6; margin-top: 6px; font-size: .72rem; }
    .light { background: #eef1f5; padding: 20px; border-radius: 14px; }
    img { display: block; }
</style>
</head>
<body>

<h2>Mark — at the sizes it has to survive</h2>
<div class="row">
    <div class="cell"><img src="cardverse-icon.svg" width="16" height="16"><small>16 favicon</small></div>
    <div class="cell"><img src="cardverse-icon.svg" width="24" height="24"><small>24</small></div>
    <div class="cell"><img src="cardverse-icon.svg" width="32" height="32"><small>32</small></div>
    <div class="cell"><img src="cardverse-mark.svg" width="48" height="48"><small>48</small></div>
    <div class="cell"><img src="cardverse-mark.svg" width="64" height="64"><small>64</small></div>
    <div class="cell"><img src="cardverse-mark.svg" width="128" height="128"><small>128 mark</small></div>
</div>

<h2>Glyph — no badge, for coloured surfaces</h2>
<div class="row">
    <div class="cell"><img src="cardverse-glyph.svg" width="128" height="112"><small>on dark</small></div>
    <div class="cell light"><img src="cardverse-glyph.svg" width="128" height="112"><small>on light</small></div>
</div>

<h2>Lockups</h2>
<div class="row">
    <div class="cell"><img src="cardverse-logo.svg" width="240"><small>stacked</small></div>
    <div class="cell"><img src="cardverse-wide.svg" width="420"><small>wide</small></div>
</div>

<h2>Wide, transparent</h2>
<div class="row">
    <div class="cell light"><img src="cardverse-wide-trim.svg" width="420"><small>on light</small></div>
</div>

</body>
</html>
